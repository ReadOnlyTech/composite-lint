# yamllint disable rule:line-length
---

name: Lint

on:  # yamllint disable-line rule:truthy
  pull_request:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

permissions: {}

jobs:
  lint:
    name: Lint the repo with the action itself
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint
        uses: $/
        with:
          exclude: tests/fail
          go-version-file: tests/pass/go/go.mod

  test:
    name: Test fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: versions/.python-version

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: tests/pass/go/go.mod

      # setup-terraform has no input for reading a version file
      - name: Resolve Terraform version
        id: terraform
        run: echo "version=$(bin/lint.sh version terraform)" >>"${GITHUB_OUTPUT}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          # The stdout wrapper interferes with reading Terraform's output
          terraform_wrapper: false

      - name: Install linters
        run: bin/lint.sh install tests

      - name: Run fixtures
        run: tests/run.sh
