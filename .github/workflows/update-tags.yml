# yamllint disable rule:line-length
---

name: Update Tags

on:  # yamllint disable-line rule:truthy
  release:
    types:
      - published

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

permissions: {}

jobs:
  tags:
    name: Update Floating Tags
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: write  # to create and update tags
    outputs:
      latest: ${{ steps.tags.outputs.latest }}
    steps:
      # vX.Y, vX, and latest get set to the same commit as vX.Y.Z
      # IFF vX.Y.Z is the newest release for each of those series
      - name: Update tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # without shell: bash, pipefail is off, which would let a failed `gh api` look like "not the newest"
          set -o pipefail

          if [[ ! ${RELEASE_TAG} =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "${RELEASE_TAG} isn't a full vX.Y.Z release; leaving the floating tags alone"
            exit
          fi

          major="v${BASH_REMATCH[1]}"
          minor="${major}.${BASH_REMATCH[2]}"
          readonly major minor

          move_tag() {
            local tag="${1}"
            readonly tag
            if gh api "repos/${REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${REPO}/git/refs/tags/${tag}" -f sha="${SHA}" -F force=true >/dev/null
            else
              gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${SHA}" >/dev/null
            fi

            echo "${tag} -> ${SHA}"
            if [[ ${tag} == latest ]]; then
              echo 'latest=true' >>"${GITHUB_OUTPUT}"
            fi
          }

          # Moves the given tag to this release if it's the newest full release whose tag starts with the given prefix
          move_if_newest() {
            local tag="${1}" prefix="${2}" newest
            newest="$(gh api --paginate "repos/${REPO}/git/matching-refs/tags/${prefix}" --jq '.[].ref | ltrimstr("refs/tags/")' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            readonly tag prefix newest

            if [[ ${newest} == "${RELEASE_TAG}" ]]; then
              move_tag "${tag}"
            else
              echo "${RELEASE_TAG} isn't the newest release for ${tag} (${newest} is); leaving it alone"
            fi
          }

          move_if_newest "${minor}" "${minor}."
          move_if_newest "${major}" "${major}."
          move_if_newest latest v

  readme:
    name: Update README
    needs: tags
    runs-on: ubuntu-latest
    if: ${{ needs.tags.outputs.latest == 'true' }}
    permissions:
      contents: write  # to push the README change
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.BASE_BRANCH }}

      # The examples use this release's tag (releases are immutable) and the bundled pre-commit-hooks rev, which is a
      # commit hash with a `# frozen: vX.Y.Z` comment (its releases aren't immutable)
      - name: Point the README examples at this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          hooks_rev="$(sed -nE 's/^\s*rev:\s*(.+)$/\1/p' configs/pre-commit.yaml)"
          readonly hooks_rev
          sed -Ei \
            -e "s|(uses: ReadOnlyTech/composite-lint@).*|\1${RELEASE_TAG}|" \
            -e "\|repo: https://github.com/ReadOnlyTech/composite-lint$|{n;s|(rev: ).*|\1${RELEASE_TAG}|}" \
            -e "\|repo: https://github.com/pre-commit/pre-commit-hooks$|{n;s|(rev: ).*|\1${hooks_rev}|}" \
            README.md
          if git diff --quiet; then
            echo 'The README already uses this release'
            exit
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Checkout doesn't persist credentials, so authenticate the push with GH_TOKEN via gh
          gh auth setup-git
          git commit -am "docs: use ${RELEASE_TAG} in the README examples"
          git push origin "HEAD:${BASE_BRANCH}"
